# A test that never ends must fail, not hang the build. Each timed test runs on its own thread, which JUnit abandons
# at the deadline, so a loop that ignores interrupts or is stuck in blocking I/O still stops: the default mode only
# interrupts the test's thread and waits for it.
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
# Tests without their own @Timeout. The slowest test class takes about 10 s.
junit.jupiter.execution.timeout.default = 60 s
