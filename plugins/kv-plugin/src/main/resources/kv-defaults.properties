# The key-value plugin's shipped settings. These are the only place its limits are written down: the code holds no number
# that limits the store. Override them with a file named by -Dkv.config=<path>, and for one server with
# server.<serverId>.<key> entries in that file.

# Replication to the other members of the swarm, which needs the gossip plugin on the same server: on or off.
replication=off

# Longest key, in characters.
namespace.kv.max.key.length=256

# Largest value, as UTF-8 bytes of its JSON.
namespace.kv.max.value.bytes=16384

# Pairs one server accepts from its own clients.
namespace.kv.max.records=1000

# How long a deletion record is kept, by its own timestamp. It must outlast any partition the swarm should survive, or a
# server that was cut off can bring a deleted key back. Matches the gossip plugin's default terminal retention (30 minutes).
namespace.kv.tombstone.retention.millis=1800000

# Time between the periodic comparisons of this server's pairs with another server's, in milliseconds.
sync.round.millis=2000

# How many other servers each comparison round talks to.
sync.fanout=1

# Largest message sent while comparing, in bytes. A larger store is compared in several messages.
sync.max.bytes=32768
