# The key-value plugin's shipped settings. These are the only place its limits are written down: the code holds no number
# that limits the store. Override them with a file named by -Dkv.config=<path>, and for one server with
# server.<serverId>.<key> entries in that file.

# Replication to the other members of the swarm, which needs the gossip plugin on the same server: on or off.
replication=off

# Longest key, in characters.
namespace.kv.max.key.length=256

# Largest value, as UTF-8 bytes of its JSON.
namespace.kv.max.value.bytes=16384

# Pairs one server accepts from its own clients.
namespace.kv.max.records=1000

# How long a deletion record is kept, by its own timestamp. It must outlast any partition the swarm should survive, or a
# server that was cut off can bring a deleted key back. Matches the gossip plugin's default terminal retention (30 minutes).
namespace.kv.tombstone.retention.millis=1800000

# Time between the periodic comparisons of this server's pairs with another server's, in milliseconds.
sync.round.millis=2000

# How many other servers each comparison round talks to.
sync.fanout=1

# Largest message sent while comparing, in bytes. A larger store is compared in several messages.
sync.max.bytes=32768

# The size of this server's push mesh: the peers, chosen at random among those alive and kept from write to write, that
# its writes are pushed to. A server that receives a record new to it passes it on to its own mesh, leaving out the server
# that sent it, so a write spreads through the swarm in a few hops. A peer that pushes here joins this server's mesh too,
# up to twice this size, so pushes flow both ways. The periodic comparison repairs whatever a push misses.
push.fanout=3

# A record stamped more than this far ahead of this server's own clock is refused and counted, since a server with a
# wrong clock could otherwise write a version that nothing could overwrite. A server whose pushes are refused for this
# is dropped from the push mesh for a while.
max.clock.skew.millis=60000

# How long, in milliseconds, writes for one peer are collected before they are sent to it together. A key written
# several times in that time is sent once, at its newest version. 0 sends every write at once, on its own.
push.batch.millis=10

# Values larger than this, as UTF-8 bytes of their JSON, are first announced to a peer by key and version, and sent only
# if the peer does not hold them yet; smaller ones are sent whole straight away.
push.announce.bytes=1024
